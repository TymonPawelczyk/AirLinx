<h1>Animacja „łączenie”</h1><p>Romb wylatuje z lewego szewronu, przechodzi przez szczelinę i znika w prawym. Szewrony delikatnie „podają” klatkę. Pętla 1,6 s, <code>cubic-bezier(.65,0,.35,1)</code>. Przy <code>prefers-reduced-motion: reduce</code> romb stoi w miejscu i tylko powoli pulsuje (opacity).</p>
<div class="row"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Łączenie…"><title>AirLinx — łączenie</title><style>
.live-c{fill:#F3F2EF}
.live-f{fill:#3DF2A0;transform-box:fill-box;transform-origin:center;animation:live-fly 1.6s cubic-bezier(.65,0,.35,1) infinite;}
.live-l{animation:live-pl 1.6s cubic-bezier(.65,0,.35,1) infinite;}
.live-r{animation:live-pr 1.6s cubic-bezier(.65,0,.35,1) infinite;}
@keyframes live-fly{0%{transform:translateX(-39.29px) scale(.3);opacity:0}20%{opacity:1}
 50%{transform:translateX(0) scale(1);opacity:1}80%{opacity:1}100%{transform:translateX(39.29px) scale(.3);opacity:0}}
@keyframes live-pl{0%,100%{transform:translateX(0)}12%{transform:translateX(-3px)}30%{transform:translateX(0)}}
@keyframes live-pr{0%,62%,100%{transform:translateX(0)}88%{transform:translateX(3px)}}
@keyframes live-br{0%,100%{opacity:1}50%{opacity:.4}}
@media (prefers-reduced-motion: reduce){
 .live-f{animation:live-br 2.4s ease-in-out infinite;transform:none}
 .live-l,.live-r{animation:none}
}</style><path class="live-c live-l" d="M8 195.44 46.94 128 8 60.56H45.77L84.71 128L45.77 195.44Z"/><path class="live-c live-r" d="M248 195.44 209.06 128 248 60.56H210.23L171.29 128L210.23 195.44Z"/><path class="live-f frame" d="M111.51 128 128 99.44 144.49 128 128 156.56 111.51 128Z"/></svg>
