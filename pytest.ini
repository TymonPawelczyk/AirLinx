[pytest]
testpaths = tests
asyncio_default_fixture_loop_scope = function
# Default run: fast and offline. UI/landing e2e (Playwright) and live TV tests are opt-in:
#   pytest -m e2e                            browser tests against ui/ (mock) and site/
#   AIRLINX_TV_IP=<tv-ip> pytest -m tv  real TV (idle TV only, never forces)
addopts = --strict-markers -m "not e2e and not tv"
markers =
    tv: needs a real TV on the LAN (opt-in with -m tv and AIRLINX_TV_IP; skipped when the TV is busy)
    e2e: Playwright browser tests (opt-in with -m e2e; need `playwright install chromium`)
    slow: takes more than a few seconds (deselect with -m "not slow")
filterwarnings =
    ignore::pytest.PytestRemovedIn10Warning
